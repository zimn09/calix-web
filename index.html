<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Calix</title>
  <style>
:root {
  --bg: #0b1020;
  --surface: #13182a;
  --surface-alt: #0f1529;
  --border: #1e2438;
  --text: #e8ecf5;
  --muted: #8b95a7;
  --accent: #4dabf7;
  --green: #69db7c;
  --yellow: #ffd43b;
  --red: #ff6b6b;
  --radius: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #05070f;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
}

body { display: flex; justify-content: center; }

.app {
  width: 100%;
  max-width: 460px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* ------------------------------------------------------------- top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 14px 9px 6px;
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
  min-height: 58px;
}

.topbar .back {
  width: 38px;
  height: 38px;
  border: 0;
  background: transparent;
  color: var(--muted);
  display: grid;
  place-items: center;
  border-radius: 50%;
  cursor: pointer;
  flex: 0 0 auto;
}
.topbar .back:hover { background: #182036; color: var(--text); }
.topbar .back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.titles { min-width: 0; }
.titles h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.titles .sub {
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* -------------------------------------------------------------- screen */
.screen {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.screen > * { flex: 0 0 auto; }

.screen::-webkit-scrollbar { width: 0; }

h2.section {
  margin: 4px 0 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
}

.card.flush { padding: 6px; }
.card.plain { padding: 0; }

.muted { color: var(--muted); font-size: 11px; }
.tiny { font-size: 10px; }

.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.spacer { flex: 1 1 auto; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.stack.tight { gap: 2px; }

/* ------------------------------------------------------------ progress */
.progress-head { display: flex; align-items: center; gap: 8px; }
.progress-head .title { font-size: 14px; font-weight: 600; flex: 1; }
.progress-head .count { font-size: 12px; color: var(--muted); }

.bar {
  height: 6px;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden;
  margin: 6px 0 4px;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width .25s ease;
}
.bar.thin { height: 4px; }
.bar.green > i { background: var(--green); }
.bar.yellow > i { background: var(--yellow); }

/* --------------------------------------------------------------- tiles */
.tiles { display: flex; gap: 8px; }
.tile {
  flex: 1 1 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text);
  font: inherit;
  font-size: 11px;
  transition: border-color .15s, transform .05s;
}
.tile:hover { border-color: #2a3550; }
.tile:active { transform: scale(.98); }
.tile svg { width: 22px; height: 22px; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* --------------------------------------------------------------- lists */
.list { display: flex; flex-direction: column; }

.item-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color .15s, transform .05s;
}
.item-card:hover { border-color: #2a3550; }
.item-card:active { transform: scale(.995); }
.item-card .text { min-width: 0; flex: 1 1 auto; }
.item-card .text .name { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-card .text .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-card .go { color: var(--green); flex: 0 0 auto; display: grid; place-items: center; }
.item-card .go svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; }

.item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 8px;
  background: transparent;
  border: 0;
  color: var(--text);
  font: inherit;
  text-align: left;
  width: 100%;
  cursor: pointer;
  transition: background .15s;
}
.item:hover { background: #1a2138; }

.item .icon { flex: 0 0 auto; display: grid; place-items: center; }
.item .icon svg { width: 18px; height: 18px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.item .text { min-width: 0; flex: 1 1 auto; }
.item .text .name {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item .text .meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.item .chev { color: #4a5568; flex: 0 0 auto; display: grid; place-items: center; }
.item .chev svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.cat-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 4px 4px;
}
.cat-head .bar-y { width: 3px; height: 14px; border-radius: 2px; }
.cat-head .name { font-size: 12px; font-weight: 600; }

/* ------------------------------------------------------------ filters */
.search {
  position: relative;
}
.search svg {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
}
.search input {
  width: 100%;
  padding: 10px 12px 10px 34px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  outline: none;
}
.search input:focus { border-color: #2a3550; }
.search input::placeholder { color: #5d6779; }

.chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { height: 0; }
.chip {
  flex: 0 0 auto;
  padding: 6px 12px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  white-space: nowrap;
}
.chip.selected {
  background: #1c3a5c;
  border-color: var(--accent);
  color: var(--text);
}

/* -------------------------------------------------------------- detail */
.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  background: #0e1626;
}
.badge.completed { color: var(--green); }
.badge.training { color: var(--yellow); }
.badge.available { color: var(--accent); }
.badge.locked { color: #4a5568; }

.desc { font-size: 12px; line-height: 1.45; }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; gap: 6px; font-size: 11px; color: var(--text); }
.step b { color: var(--muted); font-weight: 400; }
.note { font-size: 11px; color: var(--yellow); line-height: 1.4; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 0; }

/* ------------------------------------------------------------- buttons */
.btn {
  flex: 0 0 auto;
  min-width: 130px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--accent);
  color: #06111f;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: filter .15s, transform .05s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.99); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
}
.btn.outline:hover { border-color: #2a3550; }
.btn.danger { background: transparent; border-color: #4a2530; color: var(--red); }
.btn.green { background: var(--green); color: #06200d; }
.btn.small { padding: 8px 10px; font-size: 11px; min-width: 0; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --------------------------------------------------------------- sets */
.set-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 4px;
  font-size: 12px;
}
.set-row .check {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0;
  background: transparent;
  color: #4a5568;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.set-row .check svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
.set-row .check.on { color: var(--green); }
.set-row .amount { color: var(--muted); }

/* --------------------------------------------------------------- stats */
.stat { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.stat .k { color: var(--muted); }
.stat .v { margin-left: auto; font-weight: 600; }

/* -------------------------------------------------------------- misc */
.list-tile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  width: 100%;
  cursor: pointer;
}
.list-tile:last-child { border-bottom: 0; }
.list-tile:hover { background: #1a2138; }
.list-tile .lt-icon { color: var(--muted); display: grid; place-items: center; }
.list-tile .lt-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.list-tile .lt-title { display: block; font-size: 13px; }
.list-tile .lt-sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-all; }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 28px 12px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.empty svg { width: 34px; height: 34px; stroke: #4a5568; fill: none; stroke-width: 1.6; }

.big-icon {
  display: grid;
  place-items: center;
  margin-bottom: 4px;
}
.big-icon svg { width: 44px; height: 44px; fill: none; stroke: var(--yellow); stroke-width: 1.6; }

.center { text-align: center; }
.mt { margin-top: 8px; }

/* ----------------------------------------------------------- bottombar */
.bottombar {
  flex: 0 0 auto;
  display: flex;
  align-items: stretch;
  height: 70px;
  background: var(--surface-alt);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}

.bottombar button {
  flex: 1 1 0;
  background: transparent;
  border: 0;
  color: var(--muted);
  font: inherit;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 2px;
  position: relative;
  transition: color .15s;
}
.bottombar button svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bottombar button.active { color: var(--accent); }
.bottombar button.active::before {
  content: "";
  position: absolute;
  top: 4px;
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: #1c3a5c;
  opacity: .55;
  z-index: 0;
}
.bottombar button > * { position: relative; z-index: 1; }

/* --------------------------------------------------------------- toast */
.toast {
  position: absolute;
  left: 50%;
  bottom: 86px;
  transform: translateX(-50%);
  max-width: 86%;
  background: #1d2740;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
  z-index: 20;
}

@media (min-width: 520px) {
  body { padding: 0; background: #05070f; }
  .app {
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    box-shadow: 0 0 40px rgba(0, 0, 0, .45);
  }
}

    </nav>

    <div class="toast" id="toast" hidden></div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>

  <script>
/* Calix Store - local (browser) implementation of the Calix JSON API.
 *
 * The static build has no backend, so this file mirrors the FastAPI endpoints
 * on top of localStorage. Response shapes are identical to backend/app.py,
 * which lets the UI code stay the same.
 */
(function () {
  'use strict';

  const CATALOG = window.CALIX_CATALOG || { skills: [], workouts: [], categories: [] };
  const STORAGE_KEY = 'calix.data.v1';
  const MAX_HISTORY = 200;

  const skillsById = new Map(CATALOG.skills.map((s) => [s.id, s]));
  const workoutsById = new Map(CATALOG.workouts.map((w) => [w.id, w]));

  // --------------------------------------------------------------- storage
  function emptyState() {
    return {
      version: 1,
      progress: {},   // {skill_id: 'training' | 'completed'}
      records: {},    // {skill_id: best value}
      bests: {},      // {'exercise_id|kind': {value, name}}
      active: null,   // running session
      history: [],    // completed session summaries, newest first
      nextSessionId: 1,
      nextSetId: 1,
    };
  }

  function normalizeState(raw) {
    const out = emptyState();
    if (!raw || typeof raw !== 'object') return out;

    if (raw.progress && typeof raw.progress === 'object') {
      for (const [id, value] of Object.entries(raw.progress)) {
        if (skillsById.has(id) && (value === 'training' || value === 'completed')) {
          out.progress[id] = value;
        }
      }
    }
    if (raw.records && typeof raw.records === 'object') {
      for (const [id, value] of Object.entries(raw.records)) {
        if (skillsById.has(id) && Number.isFinite(Number(value)) && Number(value) > 0) {
          out.records[id] = Number(value);
        }
      }
    }
    if (raw.bests && typeof raw.bests === 'object') {
      for (const [key, item] of Object.entries(raw.bests)) {
        if (item && Number.isFinite(Number(item.value))) {
          out.bests[key] = { value: Number(item.value), name: String(item.name || '') };
        }
      }
    }
    if (Array.isArray(raw.history)) {
      out.history = raw.history.filter((x) => x && typeof x === 'object').slice(0, MAX_HISTORY);
    }
    if (raw.active && Array.isArray(raw.active.sets) && raw.active.sets.length) {
      const active = raw.active;
      const sets = active.sets
        .filter((s) => s && Number.isFinite(Number(s.id)))
        .map((s) => ({
          id: Number(s.id),
          ex_pos: Number(s.ex_pos) || 0,
          set_idx: Number(s.set_idx) || 0,
          exercise_id: String(s.exercise_id || ''),
          exercise_name: String(s.exercise_name || ''),
          kind: s.kind === 'hold' ? 'hold' : 'reps',
          target_reps: Number(s.target_reps) || 0,
          target_hold: Number(s.target_hold) || 0,
          reps: Number(s.reps) || 0,
          hold: Number(s.hold) || 0,
          rest_sec: Number(s.rest_sec) || 0,
          done: Boolean(s.done),
        }));
      if (sets.length) {
        out.active = {
          id: Number(active.id) || 1,
          workout_id: Number(active.workout_id) || 0,
          workout_name: String(active.workout_name || ''),
          session_date: String(active.session_date || todayISO()),
          started: String(active.started || new Date().toISOString()),
          sets,
        };
      }
    }

    const maxSessionId = out.history.reduce((max, h) => Math.max(max, Number(h.id) || 0), 0);
    out.nextSessionId = Math.max(Number(raw.nextSessionId) || 0, maxSessionId + 1, 1);
    const maxSetId = out.active ? out.active.sets.reduce((max, s) => Math.max(max, s.id), 0) : 0;
    out.nextSetId = Math.max(Number(raw.nextSetId) || 0, maxSetId + 1, 1);
    return out;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? normalizeState(JSON.parse(raw)) : emptyState();
    } catch (err) {
      console.warn('Calix: cannot read local storage', err);
      return emptyState();
    }
  }

  let data = loadState();

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err) {
      throw new Error('Browser storage is not available. Enable cookies/localStorage.');
    }
  }

  // ----------------------------------------------------------------- utils
  function todayISO() {
    const d = new Date();
    const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function statusOf(skill, progress) {
    const cur = progress[skill.id];
    if (cur === 'completed') return 'completed';
    if (skill.prereqs.every((p) => progress[p] === 'completed')) {
      return cur === 'training' ? 'training' : 'available';
    }
    return 'locked';
  }

  function skillPayload(skill, progress) {
    const missing = skill.prereqs
      .filter((p) => progress[p] !== 'completed')
      .map((p) => (skillsById.get(p) || { name: p }).name);
    return {
      id: skill.id,
      name: skill.name,
      category: skill.category,
      category_name: skill.category_name,
      category_color: skill.category_color,
      tier: skill.tier,
      tier_name: skill.tier_name,
      description: skill.description,
      steps: skill.steps,
      exercises: skill.exercises,
      regressions: skill.regressions,
      unit: skill.unit,
      target: skill.target,
      note: skill.note,
      status: statusOf(skill, progress),
      best: data.records[skill.id] ?? null,
      prereqs: skill.prereqs,
      missing,
    };
  }

  function workoutPayload(workout) {
    const totalSets = workout.entries.reduce((sum, e) => sum + Number(e.sets), 0);
    return {
      id: workout.id,
      name: workout.name,
      description: workout.description || '',
      style: workout.style || '',
      exercise_count: workout.entries.length,
      total_sets: totalSets,
      minutes: Math.max(1, Math.round((totalSets * 40) / 60)),
    };
  }

  function sessionPayload(session) {
    const current = session.sets.find((s) => !s.done) || null;
    return {
      id: session.id,
      sets: session.sets,
      current,
      remaining: session.sets.filter((s) => !s.done).length,
    };
  }

  function activePayload() {
    const session = data.active;
    if (!session) return { active: null };
    return {
      active: {
        ...sessionPayload(session),
        workout_name: session.workout_name,
        session_date: session.session_date,
        started: session.started,
        elapsed_sec: elapsedOf(session),
      },
    };
  }

  function elapsedOf(session) {
    const started = Date.parse(session.started || '');
    if (!Number.isFinite(started)) return 0;
    return Math.max(0, Math.round((Date.now() - started) / 1000));
  }

  function requireActive(sid) {
    if (!data.active || data.active.id !== Number(sid)) {
      throw new Error('No active session.');
    }
    return data.active;
  }

  // -------------------------------------------------------------- endpoints
  function getMeta() {
    return {
      version: '1.0.0-static',
      data_dir: 'this browser (localStorage)',
      db_path: STORAGE_KEY,
      skill_count: CATALOG.skills.length,
    };
  }

  function getSkills() {
    return {
      categories: CATALOG.categories,
      skills: CATALOG.skills.map((s) => skillPayload(s, data.progress)),
    };
  }

  function getSkill(sid) {
    const skill = skillsById.get(sid);
    if (!skill) throw new Error('Unknown skill');
    return skillPayload(skill, data.progress);
  }

  function setSkillStatus(sid, status) {
    if (!skillsById.has(sid)) throw new Error('Unknown skill');
    if (![null, 'training', 'completed'].includes(status)) throw new Error('Invalid status');
    if (status === null) delete data.progress[sid];
    else data.progress[sid] = status;
    save();
    return getSkill(sid);
  }

  function addRecord(sid, value) {
    if (!skillsById.has(sid)) throw new Error('Unknown skill');
    const amount = Number(value);
    if (!Number.isFinite(amount) || amount <= 0) throw new Error('Value must be positive');
    data.records[sid] = Math.max(Number(data.records[sid]) || 0, amount);
    save();
    return getSkill(sid);
  }

  function getWorkouts() {
    return { workouts: CATALOG.workouts.map(workoutPayload) };
  }

  function getWorkout(wid) {
    const workout = workoutsById.get(Number(wid));
    if (!workout) throw new Error('Unknown workout');
    return {
      ...workoutPayload(workout),
      entries: workout.entries.map((e) => ({
        exercise_id: e.exercise_id,
        name: e.name,
        kind: e.kind,
        sets: e.sets,
        reps: e.reps,
        hold_sec: e.hold_sec,
        rest_sets: e.rest_sets,
        note: e.note || '',
      })),
    };
  }

  function startSession(workoutId) {
    if (data.active) throw new Error('A session is already in progress.');
    const workout = workoutsById.get(Number(workoutId));
    if (!workout || !workout.entries.length) throw new Error('This workout has no exercises.');

    const sets = [];
    workout.entries.forEach((entry, pos) => {
      for (let i = 0; i < entry.sets; i += 1) {
        const lastSet = i === entry.sets - 1;
        let rest = lastSet ? entry.rest_after || entry.rest_sets : entry.rest_sets;
        if (pos === workout.entries.length - 1 && lastSet) rest = 0;
        sets.push({
          id: data.nextSetId++,
          ex_pos: pos,
          set_idx: i,
          exercise_id: entry.exercise_id,
          exercise_name: entry.name,
          kind: entry.kind,
          target_reps: entry.reps,
          target_hold: entry.hold_sec,
          reps: entry.reps,
          hold: entry.hold_sec,
          rest_sec: rest,
          done: false,
        });
      }
    });

    data.active = {
      id: data.nextSessionId++,
      workout_id: workout.id,
      workout_name: workout.name,
      session_date: todayISO(),
      started: new Date().toISOString(),
      sets,
    };
    save();
    return { ...sessionPayload(data.active), workout_name: workout.name };
  }

  function updateSet(sid, setId, done) {
    const session = requireActive(sid);
    const row = session.sets.find((s) => s.id === Number(setId));
    if (!row) throw new Error('Unknown set');
    row.done = Boolean(done);
    save();
    return sessionPayload(session);
  }

  function discardSession(sid) {
    requireActive(sid);
    data.active = null;
    save();
    return { ok: true };
  }

  function finishSession(sid, fallbackElapsed) {
    const session = requireActive(sid);
    const doneSets = session.sets.filter((s) => s.done);
    if (!doneSets.length) {
      data.active = null;
      save();
      return { summary: null };
    }

    const summary = {
      id: session.id,
      workout_name: session.workout_name,
      session_date: session.session_date,
      elapsed_sec: Number.isFinite(Date.parse(session.started || ''))
        ? elapsedOf(session)
        : Math.max(0, Number(fallbackElapsed) || 0),
      sets_done: doneSets.length,
      sets_total: session.sets.length,
      reps_total: doneSets.reduce((n, s) => n + (s.kind === 'reps' ? s.reps : 0), 0),
      hold_total: doneSets.reduce((n, s) => n + (s.kind === 'hold' ? s.hold : 0), 0),
      exercises_done: new Set(doneSets.map((s) => s.exercise_id)).size,
    };

    // Best done set per exercise and kind, compared with previous sessions.
    const current = new Map();
    for (const s of doneSets) {
      const key = `${s.exercise_id}|${s.kind}`;
      const value = s.kind === 'reps' ? s.reps : s.hold;
      const known = current.get(key);
      if (!known || value > known.value) {
        current.set(key, { value, name: s.exercise_name });
      }
    }

    const prs = [];
    for (const [key, row] of current) {
      const previous = data.bests[key];
      if (previous && row.value > previous.value) {
        prs.push({
          name: row.name,
          value: row.value,
          previous: previous.value,
          unit: key.endsWith('|hold') ? 's' : 'reps',
        });
      }
      if (!previous || row.value > previous.value) {
        data.bests[key] = { value: row.value, name: row.name };
      }
    }

    summary.prs = prs;
    data.history.unshift(summary);
    data.history = data.history.slice(0, MAX_HISTORY);
    data.active = null;
    save();
    return { summary };
  }

  function getStats() {
    const progress = data.progress;
    const total = CATALOG.skills.length;
    let done = 0;
    let training = 0;
    for (const skill of CATALOG.skills) {
      const status = statusOf(skill, progress);
      if (status === 'completed') done += 1;
      else if (status === 'training') training += 1;
    }
    const categories = CATALOG.categories
      .map((c) => {
        const skills = CATALOG.skills.filter((s) => s.category === c.key);
        return {
          ...c,
          done: skills.filter((s) => statusOf(s, progress) === 'completed').length,
          total: skills.length,
        };
      })
      .filter((c) => c.total > 0);
    return { total, done, training, available: total - done - training, categories };
  }

  async function request(path, { method = 'GET', body } = {}) {
    const [pathname, queryString] = String(path).split('?');
    const query = new URLSearchParams(queryString || '');
    let match;

    if (pathname === '/meta' && method === 'GET') return getMeta();
    if (pathname === '/skills' && method === 'GET') return getSkills();
    if ((match = pathname.match(/^\/skills\/([^/]+)$/)) && method === 'GET') {
      return getSkill(decodeURIComponent(match[1]));
    }
    if ((match = pathname.match(/^\/skills\/([^/]+)\/status$/)) && method === 'POST') {
      return setSkillStatus(decodeURIComponent(match[1]), body ? body.status : null);
    }
    if ((match = pathname.match(/^\/skills\/([^/]+)\/record$/)) && method === 'POST') {
      return addRecord(decodeURIComponent(match[1]), body ? body.value : 0);
    }
    if (pathname === '/workouts' && method === 'GET') return getWorkouts();
    if ((match = pathname.match(/^\/workouts\/(\d+)$/)) && method === 'GET') {
      return getWorkout(match[1]);
    }
    if (pathname === '/sessions/active' && method === 'GET') return activePayload();
    if (pathname === '/sessions/start' && method === 'POST') {
      return startSession(body ? body.workout_id : 0);
    }
    if ((match = pathname.match(/^\/sessions\/(\d+)\/sets\/(\d+)$/)) && method === 'POST') {
      return updateSet(match[1], match[2], body ? body.done : false);
    }
    if ((match = pathname.match(/^\/sessions\/(\d+)\/discard$/)) && method === 'POST') {
      return discardSession(match[1]);
    }
    if ((match = pathname.match(/^\/sessions\/(\d+)\/finish$/)) && method === 'POST') {
      return finishSession(match[1], Number(query.get('elapsed')) || 0);
    }
    if (pathname === '/stats' && method === 'GET') return getStats();
    if (pathname === '/backups' && method === 'GET') {
      return { backups: [], dir: 'localStorage' };
    }
    throw new Error(`Unknown API route: ${method} ${pathname}`);
  }

  // --------------------------------------------------------- export/import
  function exportData() {
    return JSON.stringify(
      {
        app: 'calix',
        format: 1,
        exported_at: new Date().toISOString(),
        data,
      },
      null,
      2
    );
  }

  function importData(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (err) {
      throw new Error('The file is not valid JSON.');
    }
    const raw = parsed && parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
    if (!raw || typeof raw !== 'object') throw new Error('Unrecognized backup file.');
    if (!raw.progress && !raw.records && !raw.history && !raw.active) {
      throw new Error('This does not look like a Calix backup.');
    }
    data = normalizeState(raw);
    save();
    return getMeta();
  }

  function snapshot() {
    return JSON.parse(JSON.stringify(data));
  }

  window.CalixStore = {
    request,
    exportData,
    importData,
    snapshot,
    STORAGE_KEY,
  };
})();

</script>
  <script>
/* Calix Web - single page frontend.
   Same screens and behaviour as the Flet mobile app, but plain HTML/CSS/JS. */

'use strict';

const $ = (sel, root = document) => root.querySelector(sel);

const COLORS = {
  completed: '#69db7c',
  training: '#ffd43b',
  available: '#4dabf7',
  locked: '#4a5568',
};

const ICONS = {
  chevron: '<path d="M9 6l6 6-6 6"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/>',
  home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  skills: '<circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M12 7.2v5.3M12 12.5 6 17M12 12.5l6 4.5"/>',
  train: '<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>',
  stats: '<path d="M4 19V5M4 19h16"/><path d="M8 15l3-4 3 2 4-6"/>',
  more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8 12.4 2.6 2.6L16 9.6"/>',
  circle: '<circle cx="12" cy="12" r="9"/>',
  playCircle: '<circle cx="12" cy="12" r="9"/><path d="M10 8.6v6.8l5.4-3.4z" fill="currentColor" stroke="none"/>',
  radio: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>',
  lock: '<rect x="5" y="10" width="14" height="10" rx="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
  play: '<path d="M8 5l11 7-11 7z"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7"/>',
  undo: '<path d="M9 7 4 12l5 5"/><path d="M4 12h9a6 6 0 0 1 0 12"/>',
  flag: '<path d="M6 21V4h12l-2.5 4L18 12H6"/>',
  trash: '<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  database: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  folder: '<path d="M3 7h6l2 2h10v10H3z"/>',
  download: '<path d="M12 4v10m-4-4 4 4 4-4M5 19h14"/>',
  upload: '<path d="M12 20V10m-4 4 4-4 4 4M5 5h14"/>',
  events: '<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="m9 15 2 2 4-4"/>',
  trend: '<path d="M4 16l5-6 4 3 6-8"/><path d="M14 5h5v5"/>',
  dumbbell: '<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>',
};

function icon(name, extra = '') {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name] || ''}</svg>`;
}

const STATUS_ICON = {
  completed: 'checkCircle',
  training: 'playCircle',
  available: 'radio',
  locked: 'lock',
};

const state = {
  tab: 0,
  stack: [],
  override: null,
  startedAt: Number(sessionStorage.getItem('calix.startedAt') || 0),
  summary: null,
  skillsCache: null,
  filter: null,
  query: '',
};

const TAB_META = [
  ['Calix', 'offline calisthenics', 'home'],
  ['Skills', 'your progression tree', 'skills'],
  ['Workout', 'train today', 'workouts'],
  ['Stats', 'your numbers', 'stats'],
  ['More', 'settings & data', 'more'],
];

// ----------------------------------------------------------------- internet
// Static build: window.CalixStore mirrors the FastAPI endpoints on localStorage.
async function api(path, { method = 'GET', body } = {}) {
  return window.CalixStore.request(path, { method, body });
}

function toast(message) {
  const box = $('#toast');
  box.textContent = message;
  box.hidden = false;
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { box.hidden = true; }, 3200);
}

// --------------------------------------------------------------- formatting
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

const amountText = (row) => row.kind === 'hold' ? `${row.hold} s` : `${row.reps} reps`;

function progressBar(value, colorClass = '', color = '') {
  const pct = Math.max(0, Math.min(100, Math.round(value * 100)));
  const fill = color ? `background:${color}` : '';
  return `<div class="bar ${colorClass}"><i style="width:${pct}%;${fill}"></i></div>`;
}

// ------------------------------------------------------------------- shell
async function render() {
  let view;
  if (state.override) view = { name: state.override };
  else if (state.stack.length) view = state.stack[state.stack.length - 1];
  else view = { name: TAB_META[state.tab][2] };
  const title = view.title ?? TAB_META[state.tab][0];
  const sub = view.sub ?? TAB_META[state.tab][1];
  $('#page-title').textContent = title;
  $('#page-sub').textContent = sub;
  $('#back').hidden = state.stack.length === 0;

  document.querySelectorAll('.bottombar button').forEach((b) => {
    b.classList.toggle('active', Number(b.dataset.tab) === state.tab);
  });

  const screen = $('#screen');
  try {
    const result = await VIEWS[view.name](view.params || {});
    screen.innerHTML = result.html;
    if (result.title !== undefined) $('#page-title').textContent = result.title;
    if (result.sub !== undefined) $('#page-sub').textContent = result.sub;
  } catch (err) {
    screen.innerHTML = `<div class="card"><div class="desc">${esc(err.message)}</div></div>`;
  }
  screen.scrollTop = 0;
}

function setTab(index, { push = false } = {}) {
  state.tab = index;
  state.stack = [];
  state.override = null;
  if (push) history.pushState({ depth: 0 }, '');
  else history.replaceState({ depth: 0 }, '');
  render();
}

function navigate(name, params = {}) {
  state.override = null;
  state.stack.push({ name, params });
  history.pushState({ depth: state.stack.length }, '');
  render();
}

function goBack() {
  if (state.stack.length) history.back();
}

window.addEventListener('popstate', (event) => {
  const depth = event.state && typeof event.state.depth === 'number' ? event.state.depth : 0;
  if (depth === 0) {
    state.stack = [];
    state.override = null;
  } else {
    state.stack = state.stack.slice(0, depth);
  }
  render();
});

// -------------------------------------------------------------------- views
const VIEWS = {};

VIEWS.home = async () => {
  const [skills, stats] = await Promise.all([api('/skills'), api('/stats')]);
  const pct = stats.total ? stats.done / stats.total : 0;

  const next = nextUp(skills.skills).slice(0, 3);
  const nextRows = next.length
    ? next.map(skillRow).join('')
    : `<div class="empty">Everything unlocked is already completed. Legend.</div>`;

  const tiles = [
    ['skills', 'Skills', '#4dabf7', 1],
    ['train', 'Workout', '#51cf66', 2],
    ['stats', 'Stats', '#ffd43b', 3],
  ].map(([ic, label, color, tab]) =>
    `<button class="tile" data-action="tab" data-tab="${tab}">
       <span style="color:${color}">${icon(ic)}</span><span>${label}</span>
     </button>`).join('');

  return {
    html: `
      <div class="card">
        <div class="progress-head">
          <div class="title">Skill progress</div>
          <div class="count">${stats.done}/${stats.total}</div>
        </div>
        ${progressBar(pct)}
        <div class="muted">${Math.round(pct * 100)}% complete · ${stats.training} training · ${stats.available} open</div>
      </div>

      <div class="tiles">${tiles}</div>

      <h2 class="section">Next up</h2>
      ${next.length ? `<div class="card flush"><div class="list">${nextRows}</div></div>` : nextRows}
    `,
  };
};

function nextUp(skills) {
  const training = skills.filter((s) => s.status === 'training');
  const available = skills.filter((s) => s.status === 'available');
  return [...training, ...available];
}

function skillRow(skill) {
  const color = COLORS[skill.status];
  return `
    <button class="item" data-action="skill" data-id="${esc(skill.id)}">
      <span class="icon" style="color:${color}">${icon(STATUS_ICON[skill.status])}</span>
      <span class="text">
        <span class="name">${esc(skill.name)}</span>
        <span class="meta">${esc(skill.tier_name)} · ${esc(skill.category_name)}</span>
      </span>
      <span class="chev">${icon('chevron')}</span>
    </button>`;
}

VIEWS.skills = async () => {
  const data = await api('/skills');
  const search = `
    <div class="search">
      ${icon('search')}
      <input id="skill-search" type="search" placeholder="Search skills…" value="${esc(state.query)}" autocomplete="off">
    </div>`;

  const chips = [
    `<button class="chip ${state.filter === null ? 'selected' : ''}" data-action="filter" data-key="">All</button>`,
    ...data.categories.map((c) =>
      `<button class="chip ${state.filter === c.key ? 'selected' : ''}" data-action="filter" data-key="${esc(c.key)}">${esc(c.name)}</button>`),
  ].join('');

  const q = state.query.trim().toLowerCase();
  const visible = data.skills.filter((s) =>
    (!state.filter || s.category === state.filter) &&
    (!q || s.name.toLowerCase().includes(q) || s.description.toLowerCase().includes(q)));

  let rows = '';
  let currentCat = null;
  for (const skill of visible) {
    if (!q && skill.category !== currentCat) {
      currentCat = skill.category;
      rows += `<div class="cat-head">
                 <span class="bar-y" style="background:${skill.category_color}"></span>
                 <span class="name">${esc(skill.category_name)}</span>
               </div>`;
    }
    rows += skillRow(skill);
  }
  if (!visible.length) rows = `<div class="empty">No skills match this filter.</div>`;

  return {
    html: `${search}<div class="chips">${chips}</div><div class="list">${rows}</div>`,
    sub: `${visible.length} of ${data.skills.length} skills`,
  };
};

VIEWS.skill = async ({ id }) => {
  const skill = await api(`/skills/${encodeURIComponent(id)}`);
  const color = COLORS[skill.status];
  const canTrain = skill.status === 'available' || skill.status === 'training';

  const benchmark = skill.unit && skill.target
    ? `<div class="muted" style="color:${skill.best && skill.best >= skill.target ? '#69db7c' : ''}">
         Benchmark: ${skill.target} ${esc(skill.unit)}${skill.best ? ` · best ${skill.best}` : ''}
       </div>`
    : '';

  const steps = skill.steps.map((s) =>
    `<div class="step"><b>•</b><span>${esc(s)}</span></div>`).join('');

  const note = skill.note ? `<div class="note">${esc(skill.note)}</div>` : '';

  return {
    title: skill.name,
    sub: `${skill.tier_name} · ${skill.category_name}`,
    html: `
      <div class="card stack">
        <div><span class="badge ${skill.status}" style="color:${color}">${skill.status.toUpperCase()}</span></div>
        <div class="desc">${esc(skill.description)}</div>
        ${benchmark}
      </div>

      <div class="card stack">
        <h2 class="section" style="margin:0">Progression</h2>
        <div class="steps">${steps}</div>
      </div>

      ${note ? `<div class="card">${note}</div>` : ''}

      <div class="actions">
        <button class="btn" data-action="train" data-id="${esc(skill.id)}"
          ${canTrain ? '' : 'disabled'}>
          ${icon(skill.status === 'training' ? 'stop' : 'play')}
          ${skill.status === 'training' ? 'Stop training' : 'Start training'}
        </button>
        <button class="btn outline" data-action="complete" data-id="${esc(skill.id)}">
          ${icon(skill.status === 'completed' ? 'undo' : 'check')}
          ${skill.status === 'completed' ? 'Undo' : 'Complete'}
        </button>
      </div>
    `,
  };
};

VIEWS.workouts = async () => {
  const [{ active }, data] = await Promise.all([api('/sessions/active'), api('/workouts')]);

  if (active) {
    return {
      html: `
        <div class="card stack">
          <h2 class="section" style="margin:0">Workout in progress</h2>
          <div class="desc">${esc(active.workout_name)}</div>
          <div class="muted">${esc(active.session_date)} · ${Math.floor(active.elapsed_sec / 60)} min · ${active.remaining} sets left</div>
          <button class="btn" data-action="resume">${icon('play')}Resume</button>
        </div>`,
    };
  }

  const rows = data.workouts.map((w) => `
    <button class="item-card" data-action="workout" data-id="${w.id}">
      <span class="text">
        <span class="name">${esc(w.name)}</span>
        <span class="meta">${w.exercise_count} exercises · ${w.total_sets} sets · ~${w.minutes} min</span>
      </span>
      <span class="go">${icon('playCircle')}</span>
    </button>`).join('');

  return {
    html: `
      <h2 class="section">Saved workouts</h2>

  };
};

VIEWS.workout = async ({ id }) => {
  const w = await api(`/workouts/${id}`);
  const rows = w.entries.map((e, i) => {
    const amount = e.kind === 'hold' ? `${e.hold_sec} s` : `${e.reps} reps`;
    return `
      <div class="row" style="align-items:flex-start">
        <span class="muted" style="width:16px">${i + 1}</span>
        <span class="text" style="flex:1;min-width:0">
          <span class="name" style="display:block;font-size:12px">${esc(e.name)}</span>
          <span class="meta">${e.sets} × ${amount} · rest ${e.rest_sets} s</span>
        </span>
      </div>`;
  }).join('');

  return {
    title: w.name,
    sub: 'workout preview',
    html: `
      <div class="card stack">
        <div class="desc" style="font-weight:600">${esc(w.name)}</div>
        <div class="muted">${esc(w.description || '')}</div>
      </div>
      <div class="list" style="gap:4px">${rows}</div>
      <button class="btn" data-action="start" data-id="${w.id}">${icon('play')}Start workout</button>
    `,
  };
};

VIEWS.session = async () => {
  const { active } = await api('/sessions/active');
  if (!active) {
    setTimeout(() => setTab(2), 0);
    return { html: '<div class="empty">No active session.</div>' };
  }
  if (!state.startedAt) {
    state.startedAt = Date.now();
    sessionStorage.setItem('calix.startedAt', String(state.startedAt));
  }

  const current = active.current;
  const groups = [];
  let lastPos = null;
  for (const s of active.sets) {
    if (s.ex_pos !== lastPos) {
      lastPos = s.ex_pos;
      groups.push(`<div class="muted" style="padding:8px 4px 2px;font-weight:600;color:#e8ecf5">${esc(s.exercise_name)}</div>`);
    }
    groups.push(`
      <div class="set-row">
        <button class="check ${s.done ? 'on' : ''}" data-action="toggle-set" data-id="${s.id}"
          aria-label="${s.done ? 'Mark not done' : 'Mark done'}">${icon(s.done ? 'checkCircle' : 'circle')}</button>
        <span>Set ${s.set_idx + 1}</span>
        <span class="spacer"></span>
        <span class="amount">${amountText(s)}</span>
      </div>`);
  }

  const currentCard = current ? `
    <div class="card stack">
      <h2 class="section" style="margin:0">${esc(current.exercise_name)}</h2>
      <div class="desc">Set ${current.set_idx + 1} · ${amountText(current)}</div>
      <div class="muted">${active.remaining} sets left</div>
      <button class="btn" data-action="toggle-set" data-id="${current.id}">${icon('check')}Complete set</button>
    </div>` : `
    <div class="card stack">
      <div class="desc">All sets are done.</div>
      <button class="btn" data-action="finish">${icon('flag')}Finish workout</button>
    </div>`;

  return {
    title: 'Workout',
    sub: active.workout_name || 'session',
    html: `
      ${currentCard}
      <div class="card flush"><div class="list" style="padding:4px">${groups.join('')}</div></div>
      <div class="actions">
        <button class="btn danger" data-action="discard">${icon('trash')}Discard</button>
        <button class="btn" data-action="finish">${icon('flag')}Finish</button>
      </div>
    `,
  };
};

VIEWS.summary = async () => {
  const s = state.summary;
  if (!s) {
    setTimeout(() => setTab(2), 0);
    return { html: '<div class="empty">No summary.</div>' };

  const prs = (s.prs || []).map((p) => `
    <div class="card row">
      <span style="color:#69db7c">${icon('trend')}</span>
      <span class="desc">PR: ${esc(p.name)} ${p.value} ${esc(p.unit)}</span>
    </div>`).join('');

  return {
    title: 'Done',
    sub: 'workout summary',
    html: `
      <div class="card center stack">
        <div class="big-icon">${icon('events')}</div>
        <div class="desc" style="font-size:16px;font-weight:700">Workout saved</div>
        <div class="muted">${esc(s.workout_name || '')}</div>
      </div>
      <div class="card stack">
        <div class="stat"><span class="k">Sets</span><span class="v">${s.sets_done}/${s.sets_total}</span></div>
        <div class="stat"><span class="k">Reps</span><span class="v">${s.reps_total}</span></div>
        <div class="stat"><span class="k">Holds</span><span class="v">${s.hold_total} s</span></div>
        <div class="stat"><span class="k">Exercises</span><span class="v">${s.exercises_done}</span></div>

      ${prs}

  };
};

VIEWS.backups = async () => {
  const data = await api('/backups');
  const rows = data.backups.length
    ? data.backups.map((b) => `

// ------------------------------------------------------------------ actions
document.addEventListener('click', async (event) => {
  const navBtn = event.target.closest('.bottombar button');
  if (navBtn) {
    setTab(Number(navBtn.dataset.tab));
    return;
  }

  const trigger = event.target.closest('[data-action]');
  if (!trigger) return;

  const { action } = trigger.dataset;
  try {
    if (action === 'tab') {
      setTab(Number(trigger.dataset.tab));
    } else if (action === 'skill') {
      navigate('skill', { id: trigger.dataset.id });
    } else if (action === 'filter') {
      state.filter = trigger.dataset.key || null;
      render();
    } else if (action === 'train') {
      const skill = await api(`/skills/${encodeURIComponent(trigger.dataset.id)}`);
      const next = skill.status === 'training' ? null : 'training';
      await api(`/skills/${encodeURIComponent(skill.id)}/status`, {
        method: 'POST', body: { status: next },
      });
      render();
    } else if (action === 'complete') {
      const skill = await api(`/skills/${encodeURIComponent(trigger.dataset.id)}`);
      const next = skill.status === 'completed' ? null : 'completed';
      await api(`/skills/${encodeURIComponent(skill.id)}/status`, {
        method: 'POST', body: { status: next },
      });
      render();
    } else if (action === 'workout') {
      navigate('workout', { id: Number(trigger.dataset.id) });
    } else if (action === 'start') {
      await api('/sessions/start', {
        method: 'POST', body: { workout_id: Number(trigger.dataset.id) },
      });
      state.startedAt = Date.now();
      sessionStorage.setItem('calix.startedAt', String(state.startedAt));
      state.override = null;
      state.stack = [{ name: 'session', params: {} }];
      history.replaceState({ depth: 1 }, '');
      render();
    } else if (action === 'resume') {
      if (!state.startedAt) {
        state.startedAt = Date.now();
        sessionStorage.setItem('calix.startedAt', String(state.startedAt));
      }
      navigate('session', {});
    } else if (action === 'toggle-set') {
      const row = trigger.closest('.set-row');
      const isOn = row ? row.querySelector('.check').classList.contains('on') : false;
      const sid = await activeSessionId();
      await api(`/sessions/${sid}/sets/${trigger.dataset.id}`, {
        method: 'POST', body: { done: !isOn },
      });
      render();
    } else if (action === 'finish') {
      const sid = await activeSessionId();
      const elapsed = state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : 0;
      const result = await api(`/sessions/${sid}/finish?elapsed=${elapsed}`, { method: 'POST' });
      sessionStorage.removeItem('calix.startedAt');
      state.startedAt = 0;
      if (!result.summary) {
        state.stack = [];
        state.override = null;
        history.replaceState({ depth: 0 }, '');
        setTab(2);
        return;
      }
      state.summary = result.summary;
      state.override = 'summary';
      state.stack = [];
      history.replaceState({ depth: 0 }, '');
      render();
    } else if (action === 'discard') {
      const sid = await activeSessionId();
      await api(`/sessions/${sid}/discard`, { method: 'POST' });
      sessionStorage.removeItem('calix.startedAt');
      state.startedAt = 0;
      state.stack = [];
      state.override = null;
      history.replaceState({ depth: 0 }, '');
      render();
    } else if (action === 'export') {
      downloadExport();
    } else if (action === 'import') {
      const input = $('#import-file');
      input.value = '';
      input.click();
    }
  } catch (err) {
    toast(err.message);
  }
});

async function activeSessionId() {
  const { active } = await api('/sessions/active');
  if (!active) throw new Error('No active session');
  return active.id;
}

function downloadExport() {
  const blob = new Blob([window.CalixStore.exportData()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const now = new Date();
  const day = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  link.href = url;
  link.download = `calix-data-${day}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Data exported.');
}

$('#import-file').addEventListener('change', async () => {
  const input = $('#import-file');
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    window.CalixStore.importData(text);
    toast('Data imported.');
    await render();
  } catch (err) {
    toast(`Import failed: ${err.message}`);
  } finally {
    input.value = '';
  }
});

$('#back').addEventListener('click', goBack);

document.addEventListener('input', (event) => {
  if (event.target.id === 'skill-search') {
    state.query = event.target.value;
    clearTimeout(document._searchTimer);
    document._searchTimer = setTimeout(async () => {
      const wasFocused = document.activeElement && document.activeElement.id === 'skill-search';
      await render();
      const input = $('#skill-search');
      if (input && wasFocused) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }, 180);
  }
});

// --------------------------------------------------------------------- boot
history.replaceState({ depth: 0 }, '');
render();

</script>

    setTimeout(function () {
      if (!window.CalixStore || !window.CALIX_CATALOG) {
        var box = document.getElementById('boot-error');
        if (box) box.hidden = false;
      }
    }, 1200);
  </script>
